# Конфігураційний файл для Troodon Load Balancer
server:
  listen_addr: "0.0.0.0"
  listen_port: 6188
  prometheus_port: 9090
  log_level: "info" # Production: "warn"

  # L7 Security Limits
  client_read_timeout: 10 # Seconds (Read Header Timeout, Slowloris protection)
  max_header_size: 8192 # Bytes (Max Header Size, OOM protection)
  global_connections: 50000 # Global Concurrency Limit

  # Глобальна IP-фільтрація (захист всього сервера від ботнетів)
  ip_access_control:
    enabled: true
    default_action: "allow"
    blacklist:
      - "192.168.1.100"
      - "10.0.0.0/8"
    whitelist: []

# Порт для HTTPS. Один порт — багато доменів через SNI.
# Кожен route з блоком `tls:` обслуговується на цьому порту зі своїм сертифікатом.
# Якщо не задано — HTTPS вимкнено.
tls_port: 6443

routes:
  # HTTPS маршрут з власним сертифікатом
  - host: "api.example.com"
    tls:
      cert: "test.crt"
      key: "test.key"
      mtls:
        enabled: false # Змінити на true, щоб вимагати клієнтський сертифікат
        client_ca: "client-ca.crt" # Обов'язковий файл, якщо enabled: true
    locations:
      - path: "/api"
        upstreams: ["1.1.1.1:443"]
        health_check_path: "/"
        retry_count: 2
        upstream_tls: true

  # Ще один домен — свій сертифікат
  - host: "admin.example.com"
    tls:
      cert: "test.crt" # У реальному середовищі — окремий сертифікат
      key: "test.key"
    
    # Локальна IP-фільтрація (сценарій: закрити все, залишити вайт-ліст)
    ip_access_control:
      enabled: true
      default_action: "deny"
      whitelist:
        - "127.0.0.1"
        - "192.168.0.0/16" 
      blacklist: []

    locations:
      - path: "/"
        upstreams: ["127.0.0.1:8000"]
        health_check_path: "/"
        retry_count: 3
        timeouts:
          connect: 2
          read: 5
          write: 5
          idle: 10

  # HTTP маршрут без TLS (внутрішній сервіс)
  - host: "internal.svc"
    # tls: відсутній = тільки HTTP
    locations:
      - path: "/dummy"
        exact_match: true
        upstreams: ["127.0.0.1:8000"]
        health_check_path: "/"
        retry_count: 3
